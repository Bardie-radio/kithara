syntax = "proto3";

package bardie.auth.v1;

option csharp_namespace = "Bardie.Auth.V1";

// AuthAdapter — Kithara dials registered auth modules for work RPCs.
// v0.1 draft: RPC set and dial rules are frozen; see docs/architecture/interfaces/grpc-auth-adapter.md
// Join is via ModuleRegistry — Register is not on this service.
// User + binding persistence goes through Kithara — adapters do not open a DB.
// Authenticate is login-only; binding create/update uses UpdateUserBinding.
// Empty-DB / admin provision is host-owned invite OTP (AUTH-INVITE) — no SeedAdminBinding.

service AuthAdapter {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetProviders(GetProvidersRequest) returns (GetProvidersResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Create or replace a user↔provider binding (claim bind, forced rotate, self update).
  rpc UpdateUserBinding(UpdateUserBindingRequest) returns (UpdateUserBindingResponse);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
}

message GetProvidersRequest {}

message GetProvidersResponse {
  repeated ProviderDescriptor providers = 1;
}

message ProviderDescriptor {
  // Opaque routing handle for Authenticate/Refresh/UpdateUserBinding. Clients must NOT branch UI on this
  // (no if id == "bes"). Presentation is entirely in `ui` / `bind_form` below.
  string id = 1;
  string display_name = 2;
  // Self-describing login UI: clients switch on the oneof case only.
  oneof ui {
    // Login bag → Authenticate. Separate from binding.
    FormSchemaUi login_form = 10;
    RedirectUi redirect = 11;
    // CeremonyUi (WebAuthn / passkeys) reserved for later — still not module-name branching.
  }
  // Optional binding bag → UpdateUserBinding for both initial bind and later update.
  // Presence gates claim-bind / account-settings / must-rotate UI. Bind vs update = RPC ceremony.
  FormSchemaUi bind_form = 20;
}

message FormSchemaUi {
  repeated FormField fields = 1;
}

message FormField {
  // Key written into AuthenticateRequest.payload or UpdateUserBindingRequest.payload.
  string name = 1;
  string label = 2;
  // text | password | email | …
  string input_type = 3;
  bool required = 4;
}

message RedirectUi {
  // Browser navigates here; return hits Kithara callback, not the adapter.
  string authorize_url = 1;
}

message AuthenticateRequest {
  string provider_id = 1;
  // Credentials / callback params from login_form (or redirect callback) — never binding mutation.
  map<string, string> payload = 2;
  // Kithara-loaded binding for this subject (empty = no prior binding).
  bytes existing_binding_payload = 3;
}

message AuthenticateResponse {
  bool allowed = 1;
  string external_subject = 2;
  repeated string roles = 3;
  map<string, string> entities = 4;
  bytes binding_payload = 5;
  bool ensure_user = 6;
  // JWT — minted by module or forwarded (e.g. OIDC).
  string access_token = 7;
  // Opaque to Kithara; module owns refresh semantics.
  string refresh_token = 8;
  string token_type = 9;
  int64 expires_in = 10;
  bool must_rotate_credentials = 11;
}

message RefreshRequest {
  string provider_id = 1;
  string refresh_token = 2;
}

message RefreshResponse {
  bool allowed = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
  string token_type = 5;
}

// bind = first binding for user↔provider; update = replace existing binding (incl. forced rotate).
enum BindingCeremony {
  BINDING_CEREMONY_UNSPECIFIED = 0;
  BINDING_CEREMONY_BIND = 1;
  BINDING_CEREMONY_UPDATE = 2;
}

message UpdateUserBindingRequest {
  string provider_id = 1;
  // Kithara-owned user id (host invents the User row before calling).
  string user_id = 2;
  // Empty on first bind; prior payload on update.
  bytes existing_binding_payload = 3;
  // Opaque bag from discovery bind_form.
  map<string, string> payload = 4;
  BindingCeremony ceremony = 5;
}

message UpdateUserBindingResponse {
  bool ok = 1;
  bytes binding_payload = 2;
  string external_subject = 3;
  bool must_rotate_credentials = 4;
  repeated string roles = 5;
  map<string, string> entities = 6;
  // Safe for clients when ok=false (e.g. password too short). Never include secrets.
  string error = 7;
}
