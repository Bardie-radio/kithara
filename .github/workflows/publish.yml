name: Publish image

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve channel
        id: channel
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/heads/dev)
              echo "tag=dev" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Publish image only from dev (auto) or main (manual). Got ${{ github.ref }}." >&2
              exit 1
              ;;
          esac

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -n1 | tr -d '[:space:]')"
          if [ -z "${version}" ]; then
            echo "No <Version> found in Directory.Build.props" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Image name
        id: image
        run: |
          set -euo pipefail
          name="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.channel.outputs.tag }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
